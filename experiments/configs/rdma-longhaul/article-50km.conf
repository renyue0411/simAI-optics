# Reproduce the single-400G-NIC transport-level result from the HPE/Juniper
# 50 km 800GE DCI article.  Two PTX-class DCI routers are connected by the
# 800G long-haul link, while one tested endpoint NIC is 400G.  Multiple 400G
# NICs are added only after this single-NIC baseline.

HOST_RATE=400Gbps
DCI_RATE=800Gbps
ACCESS_DELAY_US=1
DCI_DELAY_US=245

MTU=4096
WINDOW_BYTES=2097152
ACK_EVERY_PACKETS=4
BYTES_PER_QP=67108864
QPS=1,2,4,8,13,16,32

# Disabled in the article-throughput baseline so that the QP-window effect is
# measured independently.  A later experiment will sweep false ACK timeouts.
RETRY_ENABLED=0
RTO_US=1000
RETRY_COUNT=7

FLOW_START=0.1
STOP=1.0
SEED=1
