# Single-QP distance sweep derived from the HPE/Juniper 50 km experiment.
# The article reports 245 us one-way propagation over 50 km, so the sweep
# uses 4.9 us/km and keeps all non-distance parameters unchanged.

DISTANCES_KM=10,20,30,40,50
PROPAGATION_US_PER_KM=4.9

HOST_RATE=400Gbps
DCI_RATE=800Gbps
ACCESS_DELAY_US=1

MTU=4096
WINDOW_BYTES=2097152
ACK_EVERY_PACKETS=4
BYTES_PER_QP=67108864
QPS=1

RETRY_ENABLED=0
RTO_US=1000
RETRY_COUNT=7

FLOW_START=0.1
STOP=1.0
SEED=1
