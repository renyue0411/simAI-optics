# Fig. 5 window-sweep configuration
# Fixed workload: 256 QPs, 512 MiB aggregate (2 MiB/QP)
# Window: 10000 us; switch interval: 10 us; mode: baseline
ENABLE_QCN 1
USE_DYNAMIC_PFC_THRESHOLD 1

PACKET_PAYLOAD_SIZE 9000

FLOW_FILE __OUTPUT_DIR__/flow1.txt
TRACE_FILE __OUTPUT_DIR__/trace1.txt
TRACE_OUTPUT_FILE __OUTPUT_DIR__/llama_hpn7_mix.tr
FCT_OUTPUT_FILE __OUTPUT_DIR__/llama_hpn7_fct.txt
PFC_OUTPUT_FILE __OUTPUT_DIR__/llama_hpn7_pfc.txt

SIMULATOR_STOP_TIME 40000000000000.00

# OCS statistics log: 0=disable, 1=enable
# OCS_STATS_INTERVAL_US=0 means final summary only.
OCS_STATS_ENABLE 1
OCS_STATS_START_US 0
OCS_STATS_INTERVAL_US 1000
# OCS time-slice schedule: 0=disable, 1=enable
OCS_SCHEDULE_ENABLE 1
OCS_SCHEDULE_FILE experiments/workloads/fig5-window-schedules/rail-only-3slot-w10ms-sw10us.txt

# Injection control: 0=default, 1=RNIC, 2=user space
RDMA_TRANSPORT_MODE 0
# Mode-1 RNIC dynamic DATA/ACK deadline. The zero-valued environment guards
# match the current ns-3 model (shared clock and no extra unmodelled pipeline).
RNIC_DEADLINE_ENABLE 0
RNIC_DEADLINE_PIPELINE_GUARD_NS 0
RNIC_DEADLINE_CLOCK_GUARD_NS 0
RNIC_DEADLINE_INITIAL_GUARD_NS 0
RNIC_DEADLINE_MIN_RTT_SAMPLES 4
RNIC_DEADLINE_RTTVAR_MULTIPLIER 4
# Mode-1 RNIC ACK recovery.
RNIC_ACK_RECOVERY_ENABLE 0
# Generate dirty cumulative ACKs this many ns before each reachable
# optical-window end. The first implementation is static per port; the
# transport helper is the extension point for later adaptive guards.
RNIC_ACK_FLUSH_GUARD_NS 10000

# Mode-2 stock-RNIC RC reliability. The RNIC timer is intentionally unaware
# of the OCS schedule; userspace observes recovery only through CQEs.
RC_ACK_RETRY_ENABLE 1
RC_ACK_TIMEOUT_NS 16777216
RC_RETRY_COUNT 7
USERSPACE_INITIAL_RTT_NS 20000
# 0 = keep deployment-mode default; positive value explicitly overrides the floor.
USERSPACE_MIN_TAIL_GUARD_NS 0

# Scale-out plane scheduler: 0=hash, 1=round-robin, 2=least-QP， 3=time hash
SCALE_OUT_PLANE_SCHEDULER 0

# Time flow table on switchs: 0 = Disabled, 1 = Existing Forwarding + Gate, 2 = Route-and-Gate
SWITCH_TIME_FLOW_MODE 0

# CC_MODE, 0: disabled, 1: DCQCN, 3: HPCC, 7: TIMELY, 8: DCTCP, 10: HPCC-PINT, 11: HPCC-PINT-DCQCN
CC_MODE 1
ALPHA_RESUME_INTERVAL 1
RATE_DECREASE_INTERVAL 4
CLAMP_TARGET_RATE 0
RP_TIMER 900 
EWMA_GAIN 0.00390625
FAST_RECOVERY_TIMES 1
RATE_AI 50Mb/s
RATE_HAI 100Mb/s
MIN_RATE 100Mb/s
DCTCP_RATE_AI 1000Mb/s

ERROR_RATE_PER_LINK 0.0000
L2_CHUNK_SIZE 4000
L2_ACK_INTERVAL 1
L2_BACK_TO_ZERO 0

HAS_WIN 1
GLOBAL_T 0
VAR_WIN 1
FAST_REACT 1
U_TARGET 0.95
MI_THRESH 0
INT_MULTI 1
MULTI_RATE 0
SAMPLE_FEEDBACK 0
PINT_LOG_BASE 1.05
PINT_PROB 1.0

RATE_BOUND 1

ACK_HIGH_PRIO 0

LINK_DOWN 0 0 0

ENABLE_TRACE 1

KMAX_MAP 6 25000000000 400 50000000000 800 100000000000 1600 200000000000 1200 400000000000 3200 1600000000000 2400
KMIN_MAP 6 25000000000 100 50000000000 200 100000000000 400 200000000000 300 400000000000 800 1600000000000 600
PMAX_MAP 6 25000000000 0.2 50000000000 0.2 100000000000 0.2 200000000000 0.8 400000000000 0.2 1600000000000 0.2

BUFFER_SIZE 32

QLEN_MON_FILE __OUTPUT_DIR__/llama_hpn7_qlen.txt
BW_MON_FILE __OUTPUT_DIR__/llama_hpn7_bw.txt
RATE_MON_FILE __OUTPUT_DIR__/llama_hpn7_rate.txt
CNP_MON_FILE __OUTPUT_DIR__/llama_hpn7_cnp.txt
MON_START 0
MON_END 400000
QP_MON_INTERVAL 100
QLEN_MON_INTERVAL 10000
BW_MON_INTERVAL 10000
RNIC_QP_STATE_TRACE_ENABLE 1
RNIC_QP_STATE_TRACE_INTERVAL_NS 5000
RNIC_QP_STATE_TRACE_SRC 0
RNIC_QP_STATE_TRACE_DST 4
RNIC_QP_STATE_TRACE_SPORT 10000
