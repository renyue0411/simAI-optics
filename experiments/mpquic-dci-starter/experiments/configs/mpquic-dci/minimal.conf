MPQUIC_SCHEDULER 0
MPQUIC_CC 0
MPQUIC_BUFFER_BYTES 67108864
MPQUIC_SEED 1
OCS_SCHEDULE_FILE ../../topologies/mpquic-dci/minimal-ocs.txt
FCT_OUTPUT_FILE __OUTPUT_DIR__/flows.csv
